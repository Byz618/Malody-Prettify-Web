<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Malody .mc chart prettifier" />
  <title>Malody Prettify Web</title>
  <style>
    :root {
      color-scheme: dark;
      --bg:#09090b; --surface:#111113; --surface-hover:#17171a;
      --border:#27272a; --border-hover:#3f3f46; --text:#fafafa;
      --muted:#a1a1aa; --subtle:#71717a; --danger:#f87171; --radius:14px;
    }

    /* Theme */
    html[data-theme="light"] {
      color-scheme: light;
      --bg: #fafafa;
      --surface: #ffffff;
      --surface-hover: #f4f4f5;
      --border: #e4e4e7;
      --border-hover: #d4d4d8;
      --text: #18181b;
      --muted: #71717a;
      --subtle: #a1a1aa;
      --danger: #dc2626;
    }

    html[data-theme="light"] .editor-header {
      background: rgba(250, 250, 250, 0.92);
    }

    html[data-theme="light"] .button.primary {
      background: #18181b;
      color: #fafafa;
      border-color: #18181b;
    }

    html[data-theme="light"] .button.primary:hover {
      background: #27272a;
    }

    html[data-theme="light"] .code-area {
      color: #27272a;
    }

    html[data-theme="light"] #inputArea {
      color: #52525b;
    }

    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%}
    body{min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
    button,input,textarea{font:inherit} button{cursor:pointer}
    #app{min-height:100vh}
    .upload-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .upload-wrapper{width:min(720px,100%);text-align:center}
    .brand{margin-bottom:34px;position:relative}
    .upload-topbar{display:flex;justify-content:flex-end;margin-bottom:18px}
    .brand-title{margin:0;font-size:30px;font-weight:650;letter-spacing:-.04em}
    .brand-subtitle{margin:8px 0 0;color:var(--muted);font-size:14px}
    .brand-top{display:flex;align-items:center;justify-content:space-between;gap:16px}
    .theme-upload-button{flex-shrink:0}
    .drop-zone{position:relative;min-height:260px;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;border:1px dashed var(--border-hover);border-radius:var(--radius);background:var(--surface);transition:background .15s,border-color .15s,transform .15s}
    .drop-zone:hover{background:var(--surface-hover);border-color:#52525b}.drop-zone.dragover{background:#18181b;border-color:#a1a1aa;transform:scale(1.01)}
    .upload-icon{width:42px;height:42px;margin-bottom:18px;color:#d4d4d8}
    .drop-title{margin:0;font-size:15px;font-weight:500}.drop-description{margin:8px 0 0;color:var(--subtle);font-size:13px}
    .file-input{
      position:absolute;
      width:1px;
      height:1px;
      padding:0;
      margin:-1px;
      overflow:hidden;
      clip:rect(0,0,0,0);
      white-space:nowrap;
      border:0;
    }
    .supported{margin-top:16px;color:var(--subtle);font-size:12px}
    .select-file-btn{
      margin-top:18px;
      height:40px;
      padding:0 20px;
      border-radius:10px;
      font-size:14px;
    }
    .editor-screen{display:none;min-height:100vh}.editor-screen.active{display:block}
    .editor-header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--border);background:rgba(9,9,11,.92);position:sticky;top:0;z-index:10;backdrop-filter:blur(12px)}
    .header-left{min-width:0;display:flex;align-items:center;gap:14px}.header-brand{font-size:15px;font-weight:600;white-space:nowrap}
    .file-name{max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:13px;padding-left:14px;border-left:1px solid var(--border)}
    .header-actions{display:flex;align-items:center;gap:8px}
    .button{height:36px;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:0 13px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text);font-size:13px;font-weight:500;transition:background .15s,border-color .15s}
    .button:hover{background:var(--surface-hover);border-color:var(--border-hover)}
    .button.primary{background:var(--text);color:#09090b;border-color:var(--text)}.button.primary:hover{background:#e4e4e7}
    .button svg{width:15px;height:15px}
    .theme-button{margin:0 auto}
    .theme-button svg{width:15px;height:15px}

    .editor-main{width:min(1400px,100%);margin:0 auto;padding:24px}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.status{color:var(--muted);font-size:12px}.status.error{color:var(--danger)}
    .editor-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .panel{min-width:0;overflow:hidden;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
    .panel-header{height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--border);color:var(--muted);font-size:12px;font-weight:500}
    .panel-label{display:flex;align-items:center;gap:8px}.panel-dot{width:7px;height:7px;border-radius:50%;background:#71717a}
    .code-area{width:100%;height:calc(100vh - 180px);min-height:480px;display:block;padding:18px;resize:none;border:0;outline:0;background:transparent;color:#e4e4e7;font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;font-size:12px;line-height:1.65;tab-size:4}
    .code-area::selection{background:#3f3f46}#inputArea{color:#a1a1aa}
    
    /* Portrait / narrow: input and output are stacked */
    @media (max-width: 800px) {
      .upload-screen{padding:18px}
      .brand-title{font-size:26px}
      .drop-zone{min-height:220px}
      .editor-header{height:auto;min-height:60px;padding:12px 14px;gap:12px}
      .header-left{overflow:hidden}
      .header-brand{display:none}
      .file-name{border-left:0;padding-left:0;max-width:48vw}
      .header-actions .button span{display:none}
      .header-actions .button{width:36px;padding:0}
      .editor-main{padding:14px}
      .editor-grid{grid-template-columns:1fr;grid-template-rows:auto auto}
      .panel{min-height:300px}
      .code-area{height:40vh;min-height:280px}
    }

    /* Landscape desktop / tablet: input and output are side-by-side */
    @media (min-width: 801px) {
      .editor-grid{
        display:grid;
        grid-template-columns:minmax(0,1fr) minmax(0,1fr);
        grid-template-rows:1fr;
        align-items:stretch;
      }
      .panel{
        height:calc(100vh - 150px);
        min-height:420px;
      }
      .code-area{
        height:calc(100vh - 192px);
        min-height:378px;
      }
    }

    @media (min-width: 1200px) {
      .editor-main{padding:24px 32px}
      .editor-grid{gap:16px}
    }
  </style>
</head>
<body>
<div id="app">
  <section id="uploadScreen" class="upload-screen">
    <div class="upload-wrapper">
      <div class="brand">
        <div class="brand-top">
          <h1 class="brand-title">Malody Prettify Web</h1>
          <button id="uploadThemeButton" class="button theme-upload-button" type="button" title="Toggle theme" aria-label="Toggle theme">
            <svg id="uploadThemeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4"/>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
            </svg>
            <span>Theme</span>
          </button>
        </div>
        <p class="brand-subtitle">Format Malody .mc chart files</p>
      </div>
      <div id="dropZone" class="drop-zone">
        <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M5 20h14"/>
        </svg>
        <p class="drop-title">Click to upload or drag and drop</p>
        <p class="drop-description">Upload a Malody chart file</p>
        <button id="selectFileButton" class="button primary select-file-btn" type="button">ファイルを選択</button>
        <div class="supported">.mc files</div>
        <input id="fileInput" class="file-input" type="file" accept=".mc,.json,application/json,text/json,text/plain" />
      </div>
    </div>
  </section>

  <section id="editorScreen" class="editor-screen">
    <header class="editor-header">
      <div class="header-left">
        <div class="header-brand">Malody Prettify</div>
        <div id="fileName" class="file-name">chart.mc</div>
      </div>
      <div class="header-actions">
        <button id="themeButton" class="button" type="button" title="Toggle theme" aria-label="Toggle theme">
          <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
          </svg>
          <span>Theme</span>
        </button>
        <button id="resetButton" class="button" type="button" title="Open another file">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/>
          </svg><span>Reset</span>
        </button>
        <button id="copyButton" class="button" type="button" title="Copy output">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="10" height="10" rx="2"/><path d="M15 9V7a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/>
          </svg><span>Copy</span>
        </button>
        <button id="downloadButton" class="button primary" type="button" title="Download .mc">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 4v12"/><path d="M7 11l5 5 5-5"/><path d="M5 20h14"/>
          </svg><span>Download</span>
        </button>
      </div>
    </header>

    <main class="editor-main">
      <div class="toolbar"><div id="status" class="status">Ready</div></div>
      <div class="editor-grid">
        <div class="panel">
          <div class="panel-header"><div class="panel-label"><span class="panel-dot"></span>Input</div></div>
          <textarea id="inputArea" class="code-area" spellcheck="false" placeholder="Paste .mc JSON here..."></textarea>
        </div>
        <div class="panel">
          <div class="panel-header"><div class="panel-label"><span class="panel-dot"></span>Prettified</div></div>
          <textarea id="outputArea" class="code-area" spellcheck="false" readonly placeholder="Prettified chart will appear here..."></textarea>
        </div>
      </div>
    </main>
  </section>
</div>

<script>
  const uploadScreen=document.getElementById("uploadScreen");
  const editorScreen=document.getElementById("editorScreen");
  const dropZone=document.getElementById("dropZone");
  const fileInput=document.getElementById("fileInput");
  const selectFileButton=document.getElementById("selectFileButton");
  const fileName=document.getElementById("fileName");
  const inputArea=document.getElementById("inputArea");
  const outputArea=document.getElementById("outputArea");
  const status=document.getElementById("status");
  const resetButton=document.getElementById("resetButton");
  const copyButton=document.getElementById("copyButton");
  const downloadButton=document.getElementById("downloadButton");
  let currentFileName="chart.mc";

  const themeButton=document.getElementById("themeButton");
  const themeIcon=document.getElementById("themeIcon");
  const uploadThemeButton=document.getElementById("uploadThemeButton");
  const uploadThemeIcon=document.getElementById("uploadThemeIcon");

  function getInitialTheme(){
    const saved=localStorage.getItem("malody-prettify-theme");
    if(saved==="light"||saved==="dark") return saved;
    return window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  }

  function applyTheme(theme){
    document.documentElement.dataset.theme=theme;
    localStorage.setItem("malody-prettify-theme",theme);

    if(theme==="light"){
      themeButton.title="Switch to dark theme";
      themeButton.setAttribute("aria-label","Switch to dark theme");
      themeIcon.innerHTML='<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>';
      uploadThemeButton.title="Switch to dark theme";
      uploadThemeButton.setAttribute("aria-label","Switch to dark theme");
      uploadThemeIcon.innerHTML=themeIcon.innerHTML;
    }else{
      themeButton.title="Switch to light theme";
      themeButton.setAttribute("aria-label","Switch to light theme");
      themeIcon.innerHTML='<path d="M21 12.8A8.5 8.5 0 1 1 11.2 3 6.7 6.7 0 0 0 21 12.8Z"/>';
      uploadThemeButton.title="Switch to light theme";
      uploadThemeButton.setAttribute("aria-label","Switch to light theme");
      uploadThemeIcon.innerHTML=themeIcon.innerHTML;
    }
  }

  applyTheme(getInitialTheme());

  function toggleTheme(){
    const current=document.documentElement.dataset.theme;
    applyTheme(current==="light"?"dark":"light");
  }

  themeButton.addEventListener("click",toggleTheme);
  uploadThemeButton.addEventListener("click",toggleTheme);

  // iOS / mobile friendly file selection
  function openFilePicker(){
    fileInput.value=""; // allow re-selecting the same file
    fileInput.click();
  }

  selectFileButton.addEventListener("click",e=>{
    e.stopPropagation();
    openFilePicker();
  });

  dropZone.addEventListener("click",e=>{
    // Avoid double-trigger if the button was clicked
    if(e.target===selectFileButton||selectFileButton.contains(e.target)) return;
    openFilePicker();
  });

  fileInput.addEventListener("change",e=>{
    const file=e.target.files?.[0];
    if(file) loadFile(file);
  });

  dropZone.addEventListener("dragover",e=>{
    e.preventDefault();
    e.stopPropagation();
    dropZone.classList.add("dragover");
  });
  dropZone.addEventListener("dragleave",e=>{
    e.preventDefault();
    e.stopPropagation();
    dropZone.classList.remove("dragover");
  });
  dropZone.addEventListener("drop",e=>{
    e.preventDefault();
    e.stopPropagation();
    dropZone.classList.remove("dragover");
    const file=e.dataTransfer.files?.[0];
    if(file) loadFile(file);
  });

  // Prefer FileReader for wider iOS Safari compatibility
  function readFileAsText(file){
    return new Promise((resolve,reject)=>{
      const reader=new FileReader();
      reader.onload=()=>resolve(reader.result);
      reader.onerror=()=>reject(reader.error||new Error("Failed to read file"));
      reader.readAsText(file,"UTF-8");
    });
  }

  async function loadFile(file){
    currentFileName=file.name.toLowerCase().endsWith(".mc")?file.name:file.name+".mc";
    fileName.textContent=currentFileName;
    try{
      const text=await readFileAsText(file);
      inputArea.value=text;
      prettifyCurrent();
      uploadScreen.style.display="none";
      editorScreen.classList.add("active");
    }catch(error){
      showError("Failed to read the file.");
      console.error(error);
    }
  }

  const CollapseType={NONE:0,OBJECT_SPACE:1,ARRAY_NO_SPACE:2};

  function getCollapseType(scope){
    if(scope==="root.time"||scope==="root.effect"||scope==="root.note")return CollapseType.OBJECT_SPACE;
    if(scope.endsWith(".beat")||scope.endsWith(".endbeat"))return CollapseType.ARRAY_NO_SPACE;
    return undefined;
  }

  class VisitorState{
    constructor(scope,indent,collapse){
      this.scope=scope;this.indent=indent;this.collapse=collapse;
      this.arrayIndentString=collapse===CollapseType.ARRAY_NO_SPACE?"":"    ".repeat(Math.max(0,indent-1));
      this.objectIndentString=collapse===CollapseType.OBJECT_SPACE?"":this.arrayIndentString;
      this.arraySplitString=collapse===CollapseType.ARRAY_NO_SPACE?"":"\n";
      this.objectSplitString=collapse===CollapseType.OBJECT_SPACE?" ":"\n";
    }
    nextLevel(collapse){return new VisitorState(this.scope,this.indent+1,collapse===undefined?this.collapse:collapse)}
    nextScope(scope){
      const fullScope=this.scope+"."+scope;
      const collapse=getCollapseType(fullScope);
      return new VisitorState(fullScope,this.indent,collapse===undefined?this.collapse:collapse);
    }
  }

  function formatValue(value,state){
    if(value!==null&&typeof value==="object"&&!Array.isArray(value)){
      const split=state.objectSplitString;
      const keys=Object.keys(value);
      let result="{"+split;
      const items=[];
      for(const key of keys){
        const valueState=state.nextScope(key);
        const formatted=formatValue(value[key],valueState);
        items.push(state.objectIndentString+JSON.stringify(key)+": "+formatted);
      }
      result+=items.join(","+split)+split;
      result+=state.objectIndentString+"}";
      return result;
    }

    if(Array.isArray(value)){
      const split=state.arraySplitString;
      let result="["+split;
      const items=[];
      const nextState=state.nextLevel();
      for(const item of value)items.push(nextState.arrayIndentString+formatValue(item,nextState));
      result+=items.join(","+split)+split;
      result+=nextState.arrayIndentString+"]";
      return result;
    }

    return JSON.stringify(value);
  }

  function prettify(data){
    const parsed=JSON.parse(data);
    const rootState=new VisitorState("root",0,CollapseType.NONE);
    return formatValue(parsed,rootState)+"\\n";
  }

  function prettifyCurrent(){
    const raw=inputArea.value;
    if(!raw.trim()){outputArea.value="";setStatus("Ready");return}
    try{
      outputArea.value=prettify(raw);
      setStatus("Prettified successfully");
    }catch(error){
      outputArea.value="";
      showError("Invalid JSON / .mc file");
      console.error(error);
    }
  }

  inputArea.addEventListener("input",prettifyCurrent);

  copyButton.addEventListener("click",async()=>{
    const value=outputArea.value;if(!value)return;
    try{
      await navigator.clipboard.writeText(value);
      const original=copyButton.innerHTML;
      copyButton.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg><span>Copied</span>`;
      setTimeout(()=>copyButton.innerHTML=original,1200);
    }catch(error){showError("Could not copy to clipboard.");console.error(error)}
  });

  downloadButton.addEventListener("click",()=>{
    const content=outputArea.value;if(!content)return;

    const blob=new Blob([content],{type:"application/octet-stream"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;

    // 必ず元ファイルの拡張子を除去して .mc を付ける
    const baseName=currentFileName.replace(/\.[^/.]+$/,"");
    a.download=baseName+".mc";

    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    setStatus("Downloaded");
  });

  resetButton.addEventListener("click",()=>{
    inputArea.value="";
    outputArea.value="";
    currentFileName="chart.mc";
    fileName.textContent="chart.mc";
    status.textContent="Ready";
    status.classList.remove("error");
    fileInput.value="";
    editorScreen.classList.remove("active");
    uploadScreen.style.display="flex";
  });

  function setStatus(message){status.textContent=message;status.classList.remove("error")}
  function showError(message){status.textContent=message;status.classList.add("error")}

  window.addEventListener("dragover",e=>e.preventDefault());
  window.addEventListener("drop",e=>e.preventDefault());
</script>
</body>
</html>
